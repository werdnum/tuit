name: Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Custom tag for the image (defaults to timestamp)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${IMAGE_PREFIX}"
          TAG="${{ github.event.inputs.tag }}"
          [ -n "${TAG}" ] || TAG=$(date +%Y%m%d_%H%M%S)
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-main
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}:cache-main,mode=max

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.IMAGE_UPDATER_APP_ID }}
          private-key: ${{ secrets.IMAGE_UPDATER_PRIVATE_KEY }}
          owner: werdnum
          repositories: kube-config

      - name: Update kube-config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}@${{ steps.build.outputs.digest }}
          DEPLOYMENT_PATH: kubernetes/manifests/workloads/tuit/deployment.yaml
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/werdnum/kube-config.git" kube-config
          cd kube-config
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          YQ_VERSION="v4.53.2"
          YQ_SHA256="d56bf5c6819e8e696340c312bd70f849dc1678a7cda9c2ad63eebd906371d56b"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

          if [ ! -f "${DEPLOYMENT_PATH}" ]; then
            echo "::warning::${DEPLOYMENT_PATH} isn't in kube-config main yet; skipping the bump"
            exit 0
          fi
          yq eval -i "(.spec.template.spec.containers[] | select(.name == \"tuit\") | .image) = \"${NEW_IMAGE}\"" "${DEPLOYMENT_PATH}"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add "${DEPLOYMENT_PATH}"
            git commit -m "chore(tuit): update image to ${IMAGE_DIGEST:0:12}

          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            git pull --rebase
            git push
          fi
