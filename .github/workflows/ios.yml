name: iOS offline tests

on:
  pull_request:
  # Pull requests only run the simulator tests when they touch the app or its fixture,
  # so every merge to main runs them in full: a server change that breaks the app's
  # REST calls shows up here.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR}" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')
          printf '%s\n' "${files}"
          if grep -qE '^(ios/|tests/harness/|\.github/workflows/ios\.yml$)' <<< "${files}"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  simulator:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install test tools
        run: |
          brew install mise postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Generate iOS project
        working-directory: ios
        run: |
          mise install
          mise exec -- tuist generate --no-open
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/tuit-devices.json
          node --input-type=module -e 'import fs from "node:fs"; const devices = JSON.parse(fs.readFileSync("/tmp/tuit-devices.json")).devices; const phone = Object.entries(devices).filter(([runtime]) => runtime.includes("iOS")).flatMap(([, list]) => list).find(d => d.name.startsWith("iPhone")); if (!phone) throw Error("No iPhone simulator"); fs.appendFileSync(process.env.GITHUB_ENV, `TUIT_IOS_DESTINATION=platform=iOS Simulator,id=${phone.udid}\n`);'
      - name: Test offline persistence, real REST replay and cold launch UI
        run: npm run test:ios:offline
      - name: Upload simulator results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-offline-results
          path: /tmp/tuit-offline-derived/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # The required status check (kube-config's ruleset reconciler names it). It reports on
  # every pull request, so a PR that doesn't touch iOS can still merge, and fails unless
  # the simulator tests passed or the change detection decided they weren't needed.
  ios:
    needs: [changes, simulator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.ios }}
          TESTS: ${{ needs.simulator.result }}
        run: |
          echo "change detection: ${CHANGES}, iOS tests needed: ${NEEDED:-unknown}, simulator tests: ${TESTS}"
          if [ "${CHANGES}" != "success" ]; then
            echo "::error::Couldn't tell whether the iOS tests were needed"
            exit 1
          fi
          if [ "${TESTS}" = "success" ] || { [ "${NEEDED}" = "false" ] && [ "${TESTS}" = "skipped" ]; }; then
            exit 0
          fi
          echo "::error::iOS simulator tests: ${TESTS}"
          exit 1
